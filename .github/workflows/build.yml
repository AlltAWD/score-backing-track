name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            name: linux-x86_64
          - os: windows-2022
            name: windows-x64
          - os: macos-15
            name: macos-universal
            # Quoted inside the value: the ';' must reach CMake, not the shell.
            cmake_args: '"-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libfreetype-dev libfontconfig1-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev \
            libxrender-dev libxcomposite-dev xvfb

      - name: Configure
        run: cmake -S native -B native/build -DCMAKE_BUILD_TYPE=Release ${{ matrix.cmake_args }}

      - name: Build
        run: cmake --build native/build --config Release --target ScoreBacking_VST3 ScoreBackingTests --parallel

      - name: Test (Linux)
        if: runner.os == 'Linux'
        working-directory: native/build
        run: xvfb-run -a ctest -C Release --output-on-failure

      - name: Test
        if: runner.os != 'Linux'
        working-directory: native/build
        run: ctest -C Release --output-on-failure

      - name: Ad-hoc sign (macOS)
        # Apple Silicon refuses to load unsigned code; this is not a Developer ID signature.
        if: runner.os == 'macOS'
        working-directory: native/build/ScoreBacking_artefacts/Release/VST3
        run: |
          codesign --force --deep --sign - "Score Backing Track.vst3"
          codesign --verify --deep --strict "Score Backing Track.vst3"
          lipo -info "Score Backing Track.vst3/Contents/MacOS/Score Backing Track"

      - name: Package
        working-directory: native/build/ScoreBacking_artefacts/Release/VST3
        run: cmake -E tar cf "${{ github.workspace }}/Score-Backing-Track-${{ matrix.name }}.zip" --format=zip "Score Backing Track.vst3"

      - uses: actions/upload-artifact@v7
        with:
          name: Score-Backing-Track-${{ matrix.name }}
          path: Score-Backing-Track-${{ matrix.name }}.zip

  release:
    # Tags create a draft release; review it and publish it by hand.
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft --generate-notes Score-Backing-Track-*.zip
